# ===============================
# APPLICATION CONFIG
# ===============================
spring.application.name=agritrack-backend
server.port=8080


# ===============================
# SQL SERVER DATABASE
# All secrets below read from environment variables first; the value after
# ":" is only a local-dev fallback so the app still boots without a .env —
# NEVER rely on the fallback in staging/production. See .env.example.
# ===============================
spring.datasource.url=${DB_URL:jdbc:sqlserver://103.91.218.31:1922;databaseName=AGRITRACK;encrypt=true;trustServerCertificate=true}

spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:Saavir@1922}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ===============================
# CLOUDINARY CONFIG
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dwt4dxpbw}

cloudinary.api-key=${CLOUDINARY_API_KEY:593477674159368}

cloudinary.api-secret=${CLOUDINARY_API_SECRET:momWLv3JxxPM9Z8EkBfNaLwElmc}


# ===============================
# GOOGLE SIGN-IN
# ===============================
google.client-id=${GOOGLE_CLIENT_ID:740018456459-c47e4vmglnkvjvjpemcrhvkfk1v09618.apps.googleusercontent.com}


# ===============================
# FIREBASE (push notifications)
# ===============================
# Path to a service-account JSON file on disk. Leave unset in local dev to
# fall back to the bundled classpath resource (firebase/*.json) — set this
# in every real environment instead of shipping the credential file.
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}


# ===============================
# EMAIL (SMTP) — for OTP delivery once a real EMAIL OtpSender is wired in
# ===============================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
mail.from-address=${MAIL_FROM_ADDRESS:no-reply@agritrack.app}


# ===============================
# SMS — for OTP delivery once a real SMS OtpSender is wired in
# ===============================
sms.provider=${SMS_PROVIDER:none}
sms.api-key=${SMS_API_KEY:}
sms.api-secret=${SMS_API_SECRET:}
sms.sender-id=${SMS_SENDER_ID:AGRITR}


# ===============================
# JWT / SESSION CONFIG
# ===============================
jwt.secret=${JWT_SECRET:THIS_IS_MY_SECRET_KEY_FOR_AGRITRACK_APPLICATION_2026}

# short-lived access token (15 minutes) — the client refreshes it automatically
jwt.access-expiration-ms=900000

# refresh token absolute lifetime
jwt.refresh-expiration-days=30

# a refresh token stops working if unused for this long, even if not expired/revoked
session.idle-timeout-minutes=20160


# ===============================
# FORGOT PASSWORD / MPIN — OTP RECOVERY
# ===============================
# No SMS/Email provider is integrated yet. While DEV_OTP_MODE (app.otp.dev-mode)
# is true, the generated OTP is echoed back in the API response so the app
# can show it in an Alert for testing. Set to false once a real OtpSender
# implementation (SMTP/SMS gateway) is wired in — see AgriTrackBackend.OTP.OtpSender.
app.otp.dev-mode=${DEV_OTP_MODE:true}
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.max-resend-per-window=3
app.otp.resend-window-minutes=15
app.otp.reset-token-expiry-minutes=10


# ===============================
# RATE LIMITING (per IP, sliding 60s window)
# ===============================
ratelimit.login.per-minute=5
ratelimit.otp.per-minute=5
ratelimit.refresh.per-minute=10
ratelimit.default.per-minute=120


# ===============================
# FLYWAY (DB MIGRATIONS)
# ===============================
# Existing schema predates Flyway (ddl-auto=none, tables created manually).
# Baselining at version 0 means Flyway will NOT try to recreate anything that
# already exists — it only applies V1__... (session/login-history tables) and
# anything after it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration


# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=INFO

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE