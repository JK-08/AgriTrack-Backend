# ===============================
# APPLICATION CONFIG
# ===============================
spring.application.name=agritrack-backend
server.port=8080

# Load local .env (KEY=VALUE, same syntax as .properties) via Spring Boot's
# own native config-import mechanism instead of the spring-dotenv library.
# spring-dotenv's EnvironmentPostProcessor was silently failing to register
# under Spring Boot 4.0.5 (Spring Framework 7's new placeholder resolver),
# so every ${VAR} placeholder below failed to resolve at startup. This is
# "optional:" so it's a no-op in staging/production, where real OS-level
# environment variables are used instead and no .env file exists.
spring.config.import=optional:file:.env[.properties]


# ===============================
# SQL SERVER DATABASE
# No hardcoded fallback — these MUST come from a real environment variable
# (.env locally via spring-dotenv, real env vars in staging/production).
# The app will fail fast at startup with a clear "could not resolve
# placeholder" error if any of these are missing. See .env.example.
# ===============================
spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver


# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ===============================
# CLOUDINARY CONFIG
# No hardcoded fallback — must come from a real environment variable.
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}

cloudinary.api-key=${CLOUDINARY_API_KEY}

cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# ===============================
# GOOGLE SIGN-IN
# No hardcoded fallback — must come from a real environment variable.
# ===============================
google.client-id=${GOOGLE_CLIENT_ID}


# ===============================
# FIREBASE (push notifications)
# ===============================
# Path to a service-account JSON file on disk. Leave unset in local dev to
# fall back to the bundled classpath resource (firebase/*.json) — set this
# in every real environment instead of shipping the credential file.
firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}


# ===============================
# EMAIL (SMTP) — for OTP delivery once a real EMAIL OtpSender is wired in
# ===============================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
mail.from-address=${MAIL_FROM_ADDRESS:no-reply@agritrack.app}


# ===============================
# SMS — for OTP delivery once a real SMS OtpSender is wired in
# ===============================
sms.provider=${SMS_PROVIDER:none}
sms.api-key=${SMS_API_KEY:}
sms.api-secret=${SMS_API_SECRET:}
sms.sender-id=${SMS_SENDER_ID:AGRITR}


# ===============================
# JWT / SESSION CONFIG
# No hardcoded fallback — must come from a real environment variable.
# ===============================
jwt.secret=${JWT_SECRET}

# short-lived access token (15 minutes) — the client refreshes it automatically
jwt.access-expiration-ms=900000

# refresh token absolute lifetime
jwt.refresh-expiration-days=30

# a refresh token stops working if unused for this long, even if not expired/revoked
session.idle-timeout-minutes=20160


# ===============================
# FORGOT PASSWORD / MPIN — OTP RECOVERY
# ===============================
# No SMS/Email provider is integrated yet. While DEV_OTP_MODE (app.otp.dev-mode)
# is true, the generated OTP is echoed back in the API response so the app
# can show it in an Alert for testing. Set to false once a real OtpSender
# implementation (SMTP/SMS gateway) is wired in — see AgriTrackBackend.OTP.OtpSender.
app.otp.dev-mode=${DEV_OTP_MODE:true}
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.max-resend-per-window=3
app.otp.resend-window-minutes=15
app.otp.reset-token-expiry-minutes=10


# ===============================
# RATE LIMITING (per IP, sliding 60s window)
# ===============================
ratelimit.login.per-minute=5
ratelimit.otp.per-minute=5
ratelimit.refresh.per-minute=10
ratelimit.default.per-minute=120


# ===============================
# FLYWAY (DB MIGRATIONS)
# ===============================
# Existing schema predates Flyway (ddl-auto=none, tables created manually).
# Baselining at version 0 means Flyway will NOT try to recreate anything that
# already exists — it only applies V1__... (session/login-history tables) and
# anything after it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration


# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=INFO

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE